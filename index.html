<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>간단 메모장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#222;font-family:system-ui,sans-serif;font-size:16px}main{max-width:600px;margin:32px auto;padding:16px}h1{font-size:24px}section,li{border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0}label{display:block;margin:12px 0 6px}input,textarea,button{font:inherit;font-size:16px}input,textarea{width:100%;padding:12px;border:1px solid #aaa;border-radius:6px}textarea{min-height:140px;resize:vertical}button{padding:10px 16px;margin:8px 6px 0 0;border:1px solid #aaa;border-radius:6px;background:#f5f5f5;cursor:pointer}button:disabled{opacity:.55;cursor:wait}ul{list-style:none;padding:0}li p{white-space:pre-wrap;overflow-wrap:anywhere}#who{overflow-wrap:anywhere}#status{min-height:24px;overflow-wrap:anywhere}[hidden]{display:none!important}

body{min-height:100vh;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("./background.png") center center / min(90vw,600px) auto no-repeat;opacity:0.5}
section{background:rgba(255,255,255,0.78)}li{background:rgba(255,255,255,0.85)}
#content{background:linear-gradient(135deg,#fff1f6 0%,#ffd7e7 50%,#f6b8d0 100%);border-color:#d989a9;color:#3f2230}
#content:focus{outline:2px solid #bd4e7c;outline-offset:2px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.details>div{min-width:0}input[type="datetime-local"]{min-width:0;max-width:100%}.check-row{display:flex;align-items:center;gap:10px;margin:8px 0}.check-row input[type="checkbox"],.saved-check input{width:20px;height:20px;flex-shrink:0;accent-color:#bd4e7c}.check-row input[type="text"]{min-width:0}.check-row button{margin:0;padding:8px}.saved-check{display:flex;align-items:flex-start;gap:10px;white-space:pre-wrap;overflow-wrap:anywhere}.saved-check:has(input:checked) span{text-decoration:line-through;color:#785664}.memo-text{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:480px){.details{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><main>
<h1>간단 메모장</h1>
<p id="status" role="status" aria-live="polite">불러오는 중…</p>
<section id="auth" hidden>
<form id="authForm">
<label for="email">이메일</label><input id="email" type="email" autocomplete="username" required>
<label for="password">비밀번호 (6자 이상)</label><input id="password" type="password" autocomplete="current-password" minlength="6" required>
<button type="submit">로그인</button><button id="signup" type="button">회원가입</button>
</form></section>
<section id="memo" hidden>
<p id="who"></p><button id="logout" type="button">로그아웃</button>
<form id="memoForm"><label for="content">메모 내용</label><textarea id="content"></textarea><div class="details"><div><label for="memoTime">날짜·시간 (선택)</label><input id="memoTime" type="datetime-local"></div><div><label for="memoPlace">장소 (선택)</label><input id="memoPlace" type="text" placeholder="예: 가온센터 B실"></div></div><label>체크리스트</label><p>완료한 항목에 체크한 뒤 저장하세요.</p><div id="checkItems"></div><button id="addCheck" type="button">+ 항목 추가</button><button type="submit">저장</button></form>
<h2>내 메모</h2><ul id="list"></ul>
</section></main>
<script>
const $=id=>document.getElementById(id);
let client, user=null, revision=0;
const message=text=>$('status').textContent=text;
function addCheck(){
 const row=document.createElement('div');row.className='check-row';
 const box=document.createElement('input');box.type='checkbox';box.setAttribute('aria-label','완료 여부');
 const input=document.createElement('input');input.type='text';input.placeholder='할 일';input.setAttribute('aria-label','체크리스트 항목');
 const remove=document.createElement('button');remove.type='button';remove.textContent='−';remove.setAttribute('aria-label','체크리스트 항목 제거');remove.onclick=()=>row.remove();
 row.append(box,input,remove);$('checkItems').append(row);
}
function resetMemo(){$('memoForm').reset();$('checkItems').replaceChildren();addCheck();}
function composeMemo(){
 const parts=[];const text=$('content').value.trim();if(text)parts.push(text);
 if($('memoTime').value)parts.push('시간: '+$('memoTime').value.replace('T',' '));
 if($('memoPlace').value.trim())parts.push('장소: '+$('memoPlace').value.trim());
 const items=[...$('checkItems').children].map(row=>{const text=row.querySelector('input[type=text]').value.trim();return text?(row.querySelector('input[type=checkbox]').checked?'☑ ':'☐ ')+text:'';}).filter(Boolean);
 if(items.length)parts.push('체크리스트\n'+items.join('\n'));
 return parts.join('\n\n');
}
$('addCheck').onclick=addCheck;addCheck();
function renderMemo(container,row){
 container.className='memo-text';container.replaceChildren();
 const lines=row.content.split('\n');
 lines.forEach((line,index)=>{
 if(!/^[☐☑] /.test(line)){const div=document.createElement('div');div.textContent=line||' ';container.append(div);return;}
 const label=document.createElement('label');label.className='saved-check';
 const box=document.createElement('input');box.type='checkbox';box.checked=line.startsWith('☑');
 const text=document.createElement('span');text.textContent=line.slice(2);label.append(box,text);container.append(label);
 box.disabled=true;
 });
}
async function run(work, pending){
 document.querySelectorAll('button').forEach(b=>b.disabled=true);message(pending);
 try {await work();}catch(e){message('오류: '+(e.message||'다시 시도해 주세요.'));}
 finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
async function load(){
 const current=user, rev=revision;if(!current)return;
 const {data,error}=await client.from('memos').select('id,content,created_at').order('created_at',{ascending:false});
 if(error)throw error;if(rev!==revision||user?.id!==current.id)return;
 $('list').replaceChildren();
 if(!data.length){const li=document.createElement('li');li.textContent='저장된 메모가 없습니다.';$('list').append(li);}
 for(const row of data){
 const li=document.createElement('li'),p=document.createElement('div'),b=document.createElement('button');
 renderMemo(p,row);b.textContent='삭제';b.type='button';
 b.onclick=()=>run(async()=>{const {error}=await client.from('memos').delete().eq('id',row.id);if(error)throw error;await load();message('삭제했습니다.');},'삭제 중…');
 li.append(p,b);$('list').append(li);
 }
}
async function show(session){
 const changed=user?.id!==session?.user?.id;user=session?.user||null;revision++;
 $('auth').hidden=!!user;$('memo').hidden=!user;$('who').textContent=user?.email||'';
 if(changed){$('list').replaceChildren();resetMemo();}
 if(user)await load();
}
async function authenticate(signup){
 if(!$('authForm').reportValidity())return;
 await run(async()=>{
 const credentials={email:$('email').value.trim(),password:$('password').value};
 const {data,error}=signup?await client.auth.signUp(credentials):await client.auth.signInWithPassword(credentials);
 if(error)throw error;
 if(!data.session){message('가입되었습니다. 이메일 확인 후 로그인해 주세요.');return;}
 $('password').value='';await show(data.session);message(signup?'가입 및 로그인되었습니다.':'로그인되었습니다.');
 },signup?'가입 중…':'로그인 중…');
}
$('authForm').onsubmit=e=>{e.preventDefault();authenticate(false);};
$('signup').onclick=()=>authenticate(true);
$('memoForm').onsubmit=e=>{e.preventDefault();run(async()=>{
 const content=composeMemo();if(!content)throw new Error('메모 내용, 시간, 장소 또는 체크리스트를 입력해 주세요.');if(!user)throw new Error('먼저 로그인해 주세요.');
 const {error}=await client.from('memos').insert({user_id:user.id,content});if(error)throw error;
 resetMemo();await load();message('저장했습니다.');
},'저장 중…');};
$('logout').onclick=()=>run(async()=>{const {error}=await client.auth.signOut();if(error)throw error;await show(null);message('로그아웃되었습니다.');},'로그아웃 중…');
(async()=>{try{
 if(!window.supabase)throw new Error('라이브러리를 불러오지 못했습니다. 새로고침해 주세요.');
 client=window.supabase.createClient('https://mxgyhqtxgqjozciytvcs.supabase.co','sb_publishable_SJ50VW_eDHDr3i8z6aXfCw_pshI_FDD',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')show(null);});
 const {data,error}=await client.auth.getSession();if(error)throw error;await show(data.session);message(user?'내 메모를 불러왔습니다.':'이메일과 비밀번호로 로그인하거나 가입하세요.');
}catch(e){message('오류: '+e.message);}})();
</script></body></html>
